name: Build Creed Times News v1.5 APK

on:
  push:
    branches: [ creedtimes-news-v1-5 ]
    paths:
      - 'v15_patch_b64/**'
      - '.github/workflows/build-news-v1-5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct v1.4 Android source
        shell: bash
        run: |
          cat news_v11_bundle/chunk_* > creedtimes-news-v1.1.b64
          test "$(wc -c < creedtimes-news-v1.1.b64)" -eq 68740
          base64 -d creedtimes-news-v1.1.b64 > CreedTimes-News-v1.1-Source.zip
          echo "60e58b871f37c18e0876238d65d959cdb98bb47793706aea4e1c08d6c94592e1  CreedTimes-News-v1.1-Source.zip" | sha256sum -c -
          mkdir appsrc
          unzip -q CreedTimes-News-v1.1-Source.zip -d appsrc
          : > /tmp/v12.patch
          for f in v12_patch_b64/chunk_*; do base64 -d "$f" >> /tmp/v12.patch; done
          (cd appsrc && patch -p0 < /tmp/v12.patch)
          sed -i 's/monogram\.png/monogram.webp/g' appsrc/app/src/main/assets/app.js
          python3 v13_overrides/apply_v13.py appsrc
          python3 v14_overrides/apply_v14.py appsrc

      - name: Apply v1.5 RSS News Desk
        shell: bash
        run: |
          : > /tmp/v15.patch
          for f in v15_patch_b64/chunk_00 v15_patch_b64/chunk_01 v15_patch_b64/chunk_02 v15_patch_b64/chunk_03 v15_patch_b64/chunk_04; do base64 -d "$f" >> /tmp/v15.patch; done
          for f in v15_patch_tail/part_*; do base64 -d "$f" >> /tmp/v15.patch; done
          echo "f344bb31b28538ad1d064599550245034145b22cfdab77c32c9d4fe604513206  /tmp/v15.patch" | sha256sum -c -
          (cd appsrc && patch -p0 < /tmp/v15.patch)
          node --check appsrc/app/src/main/assets/app.js
          (cd appsrc && node tests/logic.cjs)
          grep -q "versionName '1.5.0'" appsrc/app/build.gradle
          grep -q "Creed News Desk" appsrc/app/src/main/assets/app.js
          grep -q "newsFeed" appsrc/app/src/main/java/com/creedtimes/app/MainActivity.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build non-debuggable release APK
        working-directory: appsrc
        shell: bash
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Verify installable APK
        shell: bash
        run: |
          cp appsrc/app/build/outputs/apk/release/app-release.apk CreedTimes-v1.5.apk
          test -s CreedTimes-v1.5.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs CreedTimes-v1.5.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging CreedTimes-v1.5.apk | head -30
          sha256sum CreedTimes-v1.5.apk > CreedTimes-v1.5.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: CreedTimes-v1.5-APK
          path: |
            CreedTimes-v1.5.apk
            CreedTimes-v1.5.apk.sha256
          if-no-files-found: error
