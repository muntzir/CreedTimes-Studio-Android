name: Export Creed Times v1.2 Source

on:
  push:
    branches: [ creedtimes-news-v1-3 ]
    paths:
      - '.github/workflows/export-v12-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct v1.1 source
        shell: bash
        run: |
          cat news_v11_bundle/chunk_* > creedtimes-news-v1.1.b64
          base64 -d creedtimes-news-v1.1.b64 > CreedTimes-News-v1.1-Source.zip
          mkdir appsrc
          unzip -q CreedTimes-News-v1.1-Source.zip -d appsrc
      - name: Apply v1.2 patch
        shell: bash
        run: |
          : > /tmp/v12.patch
          for f in v12_patch_b64/chunk_*; do base64 -d "$f" >> /tmp/v12.patch; done
          cd appsrc
          patch -p0 < /tmp/v12.patch
          sed -i 's/monogram\.png/monogram.webp/g' app/src/main/assets/app.js
          zip -qr ../CreedTimes-v1.2-Source.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: CreedTimes-v1.2-Source
          path: CreedTimes-v1.2-Source.zip
          if-no-files-found: error
