name: Package Creed Times Web Build

on:
  push:
    branches:
      - creedtimes-web-build
    paths:
      - "web-build/**"
      - ".github/workflows/package-creedtimes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find web-build/theme/creed-times-2 web-build/plugin/creed-times-core -type f -name "*.php" -print0)

      - name: Build installable ZIPs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd web-build/theme && zip -rq ../../dist/creed-times-2.2.0.zip creed-times-2)
          (cd web-build/plugin && zip -rq ../../dist/creed-times-core-2.2.0.zip creed-times-core)
          cp web-build/preview/*.html dist/
          cp web-build/README.md dist/INSTALLATION-README.md

      - name: Build complete bundle
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && zip -rq creed-times-2.2-complete-package.zip             creed-times-2.2.0.zip             creed-times-core-2.2.0.zip             creed-times-homepage-preview.html             creed-times-article-preview.html             creed-times-profile-preview.html             INSTALLATION-README.md)

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: creed-times-2.2-package
          path: |
            dist/creed-times-2.2.0.zip
            dist/creed-times-core-2.2.0.zip
            dist/creed-times-2.2-complete-package.zip
            dist/creed-times-homepage-preview.html
            dist/creed-times-article-preview.html
            dist/creed-times-profile-preview.html
            dist/INSTALLATION-README.md
          if-no-files-found: error
          retention-days: 30
