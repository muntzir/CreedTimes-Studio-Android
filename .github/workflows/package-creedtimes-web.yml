name: Package Creed Times Web

on:
  push:
    branches:
      - creedtimes-web-build
    paths:
      - 'web-build/**'
      - '.github/workflows/package-creedtimes-web.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Build uploadable ZIP files
        run: |
          set -e
          mkdir -p dist
          cd web-build/theme
          zip -r ../../dist/creed-times-2.0-theme.zip creed-times-2
          cd ../plugin
          zip -r ../../dist/creed-times-core-2.0.zip creed-times-core
          cd ../..
          cp web-build/preview/CreedTimes-2.0-Preview.html dist/
          cp web-build/INSTALL.txt dist/
          cp web-build/README.md dist/

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Creed-Times-2.0-WordPress-Package
          path: dist/
          if-no-files-found: error
          retention-days: 30