          sha256sum -c chunk-sha256.txt

      - name: Reconstruct Android source
        shell: bash
        run: |
          cat bundle1k/chunk_* > android-source.b64
          test "$(wc -c < android-source.b64)" -eq 67580
          base64 -d android-source.b64 > CreedTimes_Studio_Android_Project_v1.zip
          echo "7fc7f9e3ed0738398cd176d58652a65aec5c16189eb9d28ff766c7c5c9b69158  CreedTimes_Studio_Android_Project_v1.zip" | sha256sum -c -
          unzip -q CreedTimes_Studio_Android_Project_v1.zip
          test -f CreedTimes_Studio_Android_Source/app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: CreedTimes_Studio_Android_Source
        shell: bash
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          cp CreedTimes_Studio_Android_Source/app/build/outputs/apk/debug/app-debug.apk CreedTimes-Studio.apk
          test -s CreedTimes-Studio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CreedTimes-Studio-APK
          path: CreedTimes-Studio.apk
          if-no-files-found: error
