name: Build Creed Times News v1.2 APK

on:
  push:
    branches: [ creedtimes-news-v1-2 ]
    paths:
      - 'v12_patch_b64/**'
      - '.github/workflows/build-news-v1-2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct v1.1 Android source
        shell: bash
        run: |
          cat news_v11_bundle/chunk_* > creedtimes-news-v1.1.b64
          test "$(wc -c < creedtimes-news-v1.1.b64)" -eq 68740
          base64 -d creedtimes-news-v1.1.b64 > CreedTimes-News-v1.1-Source.zip
          echo "60e58b871f37c18e0876238d65d959cdb98bb47793706aea4e1c08d6c94592e1  CreedTimes-News-v1.1-Source.zip" | sha256sum -c -
          mkdir appsrc
          unzip -q CreedTimes-News-v1.1-Source.zip -d appsrc
          test -f appsrc/app/build.gradle

      - name: Apply v1.2 redesign and features
        shell: bash
        run: |
          : > /tmp/v12.patch
          for f in v12_patch_b64/chunk_*; do
            base64 -d "$f" >> /tmp/v12.patch
          done
          cd appsrc
          patch -p0 < /tmp/v12.patch
          sed -i 's/monogram\.png/monogram.webp/g' app/src/main/assets/app.js
          node --check app/src/main/assets/app.js
          node tests/logic.cjs
          grep -q "versionName '1.2.0'" app/build.gradle
          grep -q "setDecorFitsSystemWindows(false)" app/src/main/java/com/creedtimes/app/MainActivity.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build non-debuggable release APK
        working-directory: appsrc
        shell: bash
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Verify installable APK
        shell: bash
        run: |
          cp appsrc/app/build/outputs/apk/release/app-release.apk CreedTimes-v1.2.apk
          test -s CreedTimes-v1.2.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs CreedTimes-v1.2.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging CreedTimes-v1.2.apk | head -30
          sha256sum CreedTimes-v1.2.apk > CreedTimes-v1.2.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: CreedTimes-v1.2-APK
          path: |
            CreedTimes-v1.2.apk
            CreedTimes-v1.2.apk.sha256
          if-no-files-found: error
